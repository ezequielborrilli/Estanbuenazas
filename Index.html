<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@400;600;800&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#1F2A4C;--rojo:#C62828;--verde:#6B8B5A;--crema:#F8F1E1;--card:#FFFBF2;--bd:#e6d6b8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--azul);font:16px/1.45 Nunito,system-ui,sans-serif;padding-bottom:110px}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0}
.top{text-align:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 4px}
.top img{width:min(78vw,340px);height:auto;display:block;margin:0 auto}
.chk{height:18px;background:repeating-conic-gradient(var(--rojo) 0 25%,var(--crema) 0 50%) 0 0/18px 18px;border-top:2px solid var(--rojo);border-bottom:2px solid var(--rojo)}
main{max-width:760px;margin:0 auto;padding:0 16px}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:16px 0 8px}
.steps li{flex:1;text-align:center;padding:8px 4px;border-radius:12px;border:2px solid var(--azul);font-weight:800;font-size:14px;opacity:.55}
.steps li.on{background:var(--azul);color:var(--crema);opacity:1}
h2{font-size:24px;margin:14px 0 4px}
.sub{margin:0 0 6px;color:var(--verde);font-weight:800}
.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:2px solid var(--azul);border-radius:20px;overflow:hidden}
.ph{height:150px;display:flex;align-items:center;justify-content:center;font-size:64px;background:repeating-conic-gradient(#fbe9c8 0 25%,#f7dca8 0 50%) 0 0/28px 28px}
.ph img{width:100%;height:100%;object-fit:cover}
.in{padding:12px 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:20px}.pr{font-family:Lobster,cursive;font-size:26px;color:var(--rojo)}
.mu{font-size:14px;opacity:.8}
.st{display:flex;align-items:center;gap:12px}.st b{min-width:24px;text-align:center;font-size:22px}
button{font:inherit;font-weight:800;color:var(--azul);background:var(--card);border:2px solid var(--azul);border-radius:14px;padding:10px 16px;cursor:pointer}
.st button{width:44px;height:44px;font-size:24px;padding:0}
.pri{background:var(--rojo);color:#fff;border-color:var(--rojo);font-size:18px;padding:14px;border-radius:16px;width:100%}
.tg{display:flex;gap:8px}.tg button{flex:1;padding:12px 6px}.tg .on{background:var(--azul);color:var(--crema)}
label{display:block;font-weight:800;font-size:14px;margin:14px 0 5px}
input,textarea{font:inherit;width:100%;padding:12px;border:2px solid var(--bd);border-radius:14px;background:#fff;color:var(--azul)}
input:focus,textarea:focus{outline:none;border-color:var(--azul)}
.box{background:var(--card);border:2px solid var(--azul);border-radius:20px;padding:14px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--bd)}
.tot{font-weight:800;font-size:20px;border:0!important;padding-top:10px!important}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--crema);border-top:3px solid var(--rojo);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar>div{max-width:760px;margin:0 auto}
#err{color:var(--rojo);font-weight:800;font-size:14px;min-height:18px;margin-top:8px}
.note{font-size:13px;opacity:.8;margin-top:8px}
a{color:var(--rojo)}
[hidden]{display:none!important}

<script>
var NUM="5491137686471";
var MENU=[{k:"Clásica",p:11,d:"Salsa de tomate, queso mozzarella y aceitunas"},{k:"Fugazzeta",p:13,d:"Cebolla y queso mozzarella"},{k:"Jamón y piña",p:15,d:"Jamón, piña y queso mozzarella"},{k:"Salame",p:16,d:"Salame y queso mozzarella"}];
var IMG={};
var Q=MENU.map(function(){return 0}),T="m",E="r";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function totals(){var n=0,t=0;MENU.forEach(function(m,i){n+=Q[i];t+=Q[i]*m.p});return{n:n,t:t}}
function drawMenu(){var h="";MENU.forEach(function(m,i){
h+='<div class="card"><div class="ph">'+(IMG[m.k]?'<img src="'+IMG[m.k]+'" alt="'+esc(m.k)+'">':'🍕')+'</div><div class="in"><div class="row"><h3>'+esc(m.k)+'</h3><span class="pr">S/ '+m.p+'</span></div><div class="mu">'+esc(m.d)+'</div><div class="row" style="margin-top:10px"><span class="mu">Cantidad</span><span class="st"><button data-i="'+i+'" data-d="-1" aria-label="Quitar">−</button><b>'+Q[i]+'</b><button data-i="'+i+'" data-d="1" aria-label="Agregar">+</button></span></div></div></div>'});
$("menu").innerHTML=h}
function bar(){var x=totals();$("cnt").textContent=x.n+(x.n==1?" pizza":" pizzas");$("tot").textContent="S/ "+x.t}
function drawSum(){var h="";MENU.forEach(function(m,i){if(Q[i])h+='<div><span>'+Q[i]+' × '+esc(m.k)+'</span><span>S/ '+Q[i]*m.p+'</span></div>'});h+='<div class="tot"><span>Total</span><span>S/ '+totals().t+'</span></div>';$("sum").innerHTML=h}
function route(){var c=location.hash=="#confirmar";if(c&&!totals().n){location.hash="";return}
$("v1").hidden=c;$("v2").hidden=!c;$("s1").className=c?"":"on";$("s2").className=c?"on":"";
$("go").textContent=c?"Enviar pedido por WhatsApp":"Continuar";$("err").textContent="";if(c)drawSum();window.scrollTo(0,0)}
$("menu").onclick=function(e){var b=e.target.closest("button");if(!b)return;var i=+b.dataset.i;Q[i]=Math.max(0,Q[i]+ +b.dataset.d);drawMenu();bar()};
$("hm").onclick=function(){T="m";$("hm").className="on";$("ht").className=""};
$("ht").onclick=function(){T="t";$("ht").className="on";$("hm").className=""};

$("er").onclick=function(){E="r";$("er").className="on";$("ed").className="";$("dirw").hidden=true};
$("back").onclick=function(e){e.preventDefault();location.hash=""};
var d0=new Date();$("dia").min=d0.getFullYear()+"-"+("0"+(d0.getMonth()+1)).slice(-2)+"-"+("0"+d0.getDate()).slice(-2);
window.onhashchange=route;
$("go").onclick=function(){var er=$("err");
if(location.hash!="#confirmar"){if(!totals().n){er.textContent="Elegí al menos una pizza.";return}location.hash="#confirmar";return}
var nom=$("nom").value.trim(),dia=$("dia").value,dir=$("dir").value.trim(),nota=$("not").value.trim(),items=[];
MENU.forEach(function(m,i){if(Q[i])items.push("- "+Q[i]+" x "+m.k)});
if(!nom){er.textContent="Escribí tu nombre.";return}
if(!dia){er.textContent="Elegí el día de entrega.";return}
if(E=="d"&&!dir){er.textContent="Escribí la dirección de entrega.";return}
var f=new Date(dia+"T12:00:00").toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"short"});
var msg="🍕 *PEDIDO - ¡Están Buenazas!*\nCliente: "+nom+"\nDía: "+f+" ("+dia+")\nHorario: "+(T=="m"?"Mediodía (antes de la 1)":"Tarde")+"\nEntrega: "+(E=="d"?"Delivery":"Retiro en Lurín")+(E=="d"?"\nDirección: "+dir:"")+"\n"+items.join("\n")+"\nTotal: S/ "+totals().t+(nota?"\nNota: "+nota:"");
var u="https://wa.me/"+NUM+"?text="+encodeURIComponent(msg);
er.innerHTML='Abriendo WhatsApp… <a href="'+u+'" target="_blank" rel="noopener">Si no se abre, tocá acá</a>';
var a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()};
drawMenu();bar();route();
