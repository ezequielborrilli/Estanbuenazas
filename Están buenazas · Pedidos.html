<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Están buenazas · Haz tu pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8f0;--card:#fff;--tx:#2b1d14;--mu:#7a6a5d;--ac:#c8401e;--bd:#ecdccb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--card:#2a201a;--tx:#f5e9dd;--mu:#b09c8b;--ac:#ef6a47;--bd:#43342a}}
:root[data-theme="dark"]{--bg:#1c1511;--card:#2a201a;--tx:#f5e9dd;--mu:#b09c8b;--ac:#ef6a47;--bd:#43342a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:120px}
h1,h2,.pr{font-family:Fredoka,system-ui,sans-serif}
header{background:linear-gradient(135deg,#d9481f,#f59a23);color:#fff;padding:22px 18px 20px;border-radius:0 0 28px 28px;box-shadow:0 4px 14px rgba(200,64,30,.35)}
h1{margin:0;font-size:30px}header p{margin:4px 0 0;opacity:.95}
.item,.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;margin:14px 16px;overflow:hidden;box-shadow:0 2px 8px rgba(120,70,30,.08)}
.ph{height:150px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#f6c26b,#e8743b)}
.ph img{width:100%;height:100%;object-fit:cover}
.in{padding:12px 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{margin:0;font-size:20px}.pr{font-size:20px;color:var(--ac);font-weight:700}.mu{color:var(--mu);font-size:14px}
.st{display:flex;align-items:center;gap:12px}.st b{min-width:22px;text-align:center;font-size:20px}
button{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:8px 14px}
.st button{width:42px;height:42px;font-size:22px;padding:0}
.box{padding:14px}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx)}
.tg{display:flex;gap:8px}.tg button{flex:1}.tg .on,.go{background:linear-gradient(135deg,#d9481f,#f08a24);color:#fff;border-color:transparent}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(0,0,0,.1)}
.go{width:100%;font-size:18px;padding:14px;margin-top:8px;border-radius:16px}
#st{font-size:13px;margin-top:6px;color:var(--ac)}
</style></head><body>
<header><h1>🍕 Están buenazas</h1><p>Elige tus pizzas y envía tu pedido por WhatsApp</p></header>
<div id="menu"></div>
<div class="box">
<label>Tu nombre</label><input id="nom" placeholder="Ej: Jannet">
<label>Día de entrega</label><input id="dia" type="date">
<label>Horario</label><div class="tg"><button id="hm" class="on">☀️ Mediodía (antes de la 1)</button><button id="ht">🌇 Tarde</button></div>
<label>Nota (opcional)</label><textarea id="not" rows="2" placeholder="Ej: una pizza bien cocida"></textarea>
</div>
<div class="bar"><div class="row"><span class="mu" id="cnt">0 pizzas</span><b class="pr" id="tot">S/ 0</b></div>
<button class="go" id="env">Enviar pedido por WhatsApp</button><div id="st"></div></div>
<script>
var NUM="5491137686471";
var MENU=[{k:"Clásica",p:11,d:"Salsa de tomate, queso mozzarella y aceitunas"},{k:"Fugazzeta",p:13,d:"Cebolla y queso mozzarella"},{k:"Jamón y piña",p:15,d:"Jamón, piña y queso mozzarella"},{k:"Salame",p:16,d:"Salame y queso mozzarella"}];
var IMG={};var Q=MENU.map(function(){return 0}),T="m";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){var h="",n=0,t=0;
MENU.forEach(function(m,i){n+=Q[i];t+=Q[i]*m.p;
h+='<div class="item"><div class="ph">'+(IMG[m.k]?'<img src="'+IMG[m.k]+'" alt="'+esc(m.k)+'">':'🍕')+'</div><div class="in"><div class="row"><h2>'+esc(m.k)+'</h2><span class="pr">S/ '+m.p+'</span></div><div class="mu">'+esc(m.d)+'</div><div class="row" style="margin-top:10px"><span class="mu">Cantidad</span><span class="st"><button data-i="'+i+'" data-d="-1">−</button><b>'+Q[i]+'</b><button data-i="'+i+'" data-d="1">+</button></span></div></div></div>'});
$("menu").innerHTML=h;$("cnt").textContent=n+(n==1?" pizza":" pizzas");$("tot").textContent="S/ "+t}
$("menu").onclick=function(e){var b=e.target.closest("button");if(!b)return;var i=+b.dataset.i;Q[i]=Math.max(0,Q[i]+ +b.dataset.d);draw()};
$("hm").onclick=function(){T="m";$("hm").className="on";$("ht").className=""};
$("ht").onclick=function(){T="t";$("ht").className="on";$("hm").className=""};
var d0=new Date();$("dia").min=d0.getFullYear()+"-"+("0"+(d0.getMonth()+1)).slice(-2)+"-"+("0"+d0.getDate()).slice(-2);
$("env").onclick=function(){var s=$("st"),nom=$("nom").value.trim(),dia=$("dia").value,items=[],t=0;
MENU.forEach(function(m,i){if(Q[i]){items.push("- "+Q[i]+" x "+m.k);t+=Q[i]*m.p}});
if(!items.length){s.textContent="Elige al menos una pizza.";return}
if(!nom){s.textContent="Escribe tu nombre.";return}
if(!dia){s.textContent="Elige el día de entrega.";return}
if(!NUM){s.textContent="Esta página todavía no tiene el número de WhatsApp.";return}
var f=new Date(dia+"T12:00:00").toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"short"});
var msg="🍕 *PEDIDO - Están buenazas*\nCliente: "+nom+"\nDía: "+f+" ("+dia+")\nHorario: "+(T=="m"?"Mediodía (antes de la 1)":"Tarde")+"\n"+items.join("\n")+"\nTotal: S/ "+t+($("not").value.trim()?"\nNota: "+$("not").value.trim():"");
var u="https://wa.me/"+NUM+"?text="+encodeURIComponent(msg);
s.innerHTML='Abriendo WhatsApp… <a href="'+u+'" target="_blank" rel="noopener" style="color:inherit">Si no se abre, toca aquí</a>';
try{window.open(u,"_blank","noopener")}catch(e){}};
draw();
</script></body></html>
